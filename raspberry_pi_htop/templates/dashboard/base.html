<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Raspberry Pi Dashboard{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --secondary: #8b5cf6;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --dark: #1e293b;
        --dark-light: #334155;
        --light: #f1f5f9;
        --white: #ffffff;
        --text: #0f172a;
        --text-light: #64748b;
        --border: #e2e8f0;
        --shadow: rgba(15, 23, 42, 0.08);
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--light);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        background: var(--white);
        padding: 20px 30px;
        margin-bottom: 30px;
        border-radius: 12px;
        box-shadow: 0 1px 3px var(--shadow);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header h1::before {
        content: "🥧";
        font-size: 32px;
      }

      .header-info {
        display: flex;
        gap: 20px;
        align-items: center;
        color: var(--text-light);
        font-size: 14px;
      }

      .status-badge {
        padding: 6px 12px;
        background: var(--success);
        color: var(--white);
        border-radius: 20px;
        font-weight: 500;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-badge::before {
        content: "●";
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .card {
        background: var(--white);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 3px var(--shadow);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px var(--shadow);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-light);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .card-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .icon-primary {
        background: rgba(99, 102, 241, 0.1);
      }
      .icon-success {
        background: rgba(16, 185, 129, 0.1);
      }
      .icon-warning {
        background: rgba(245, 158, 11, 0.1);
      }
      .icon-danger {
        background: rgba(239, 68, 68, 0.1);
      }

      .metric-value {
        font-size: 36px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 8px;
      }

      .metric-label {
        font-size: 13px;
        color: var(--text-light);
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--light);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 12px;
      }

      .progress-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 0.5s ease;
      }

      .progress-primary {
        background: var(--primary);
      }
      .progress-success {
        background: var(--success);
      }
      .progress-warning {
        background: var(--warning);
      }
      .progress-danger {
        background: var(--danger);
      }

      .chart-container {
        background: var(--white);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 3px var(--shadow);
        margin-bottom: 30px;
      }

      .chart-header {
        margin-bottom: 20px;
      }

      .chart-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
      }

      .table-container {
        background: var(--white);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 3px var(--shadow);
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        padding: 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-light);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid var(--border);
      }

      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
      }

      .badge-success {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
      }

      .badge-warning {
        background: rgba(245, 158, 11, 0.1);
        color: var(--warning);
      }

      .badge-danger {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
